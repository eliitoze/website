<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliitoze — Media Migration Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #d4b483;
      min-height: 100vh;
      padding: 30px 20px;
    }
    h1 {
      font-size: 20px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 6px;
    }
    .subtitle { font-size: 12px; color: #888; letter-spacing: 1px; margin-bottom: 30px; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label { font-size: 11px; letter-spacing: 2px; color: #888; display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px;
      background: #111; border: 1px solid #333; border-radius: 2px;
      color: #d4b483; font-size: 13px; margin-bottom: 12px;
    }
    input:focus { outline: none; border-color: #c9a84c; }

    .btn {
      background: #c9a84c; color: #0f0f0f;
      border: none; padding: 12px 24px;
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; border-radius: 2px; font-weight: 700;
      width: 100%;
    }
    .btn:disabled { background: #444; color: #666; cursor: not-allowed; }
    .btn-outline {
      background: transparent; border: 1px solid #c9a84c; color: #c9a84c;
    }

    /* Progress */
    #progress-section { display: none; }
    .progress-bar-wrap {
      background: #222; border-radius: 2px; height: 6px; margin: 12px 0;
    }
    .progress-bar {
      background: #c9a84c; height: 100%; border-radius: 2px;
      width: 0%; transition: width 0.3s;
    }
    .stat-row {
      display: flex; gap: 20px; margin: 12px 0;
      font-size: 12px; letter-spacing: 1px;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 22px; font-weight: 700; color: #c9a84c; }
    .stat-label { font-size: 10px; color: #666; margin-top: 2px; }

    /* Log */
    #log {
      background: #0a0a0a; border: 1px solid #222; border-radius: 2px;
      padding: 12px; height: 280px; overflow-y: auto;
      font-family: monospace; font-size: 11px; line-height: 1.8;
      margin-top: 12px;
    }
    .log-ok   { color: #4caf50; }
    .log-skip { color: #888; }
    .log-err  { color: #e05050; }
    .log-info { color: #c9a84c; }
    .log-head { color: #fff; font-weight: bold; }

    .badge {
      display: inline-block; padding: 2px 8px;
      font-size: 10px; letter-spacing: 1px; border-radius: 10px;
    }
    .badge-green { background: #1a3a1a; color: #4caf50; }
    .badge-red   { background: #3a1a1a; color: #e05050; }
    .badge-gold  { background: #2a2000; color: #c9a84c; }
  </style>
</head>
<body>

<h1>⚙ Media Migration</h1>
<p class="subtitle">Supabase Storage → GitHub Pages — automated one-time tool</p>

<!-- Config -->
<div class="card" id="config-section">
  <label>SUPABASE URL</label>
  <input id="cfg-sb-url" value="https://gyocbotkhoymkjbegkqz.supabase.co" />

  <label>SUPABASE ANON KEY</label>
  <input id="cfg-sb-key" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5b2Nib3RraG95bWtqYmVna3F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NjM3NTYsImV4cCI6MjA5MDAzOTc1Nn0.4awJdWrrZGtH2b6_Wfv2RsLkqJK6WvN26D6YJHVrwKA" />

  <label>CLOUDFLARE WORKER URL</label>
  <input id="cfg-worker" placeholder="https://eliitoze-push.xyz.workers.dev" />

  <label>ADMIN SECRET (Worker password)</label>
  <input id="cfg-secret" type="password" placeholder="Eliitoze@2025" />

  <label>GITHUB BASE URL (where images will be public)</label>
  <input id="cfg-gh-base" value="https://eliitoze.github.io/website/media/" />

  <button class="btn" onclick="startMigration()">🚀 Migration શરૂ કરો</button>
  <p style="font-size:10px;color:#555;margin-top:8px;text-align:center;">
    આ tool ફક્ત એક વખત run કરો. Supabase URLs ને GitHub URLs સાથે replace કરી દેશે.
  </p>
</div>

<!-- Progress -->
<div class="card" id="progress-section">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <span style="font-size:12px;letter-spacing:2px;" id="progress-label">Processing...</span>
    <span style="font-size:12px;color:#888;" id="progress-pct">0%</span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>

  <div class="stat-row">
    <div class="stat"><div class="stat-num" id="cnt-done">0</div><div class="stat-label">MIGRATED</div></div>
    <div class="stat"><div class="stat-num" id="cnt-skip">0</div><div class="stat-label">SKIPPED</div></div>
    <div class="stat"><div class="stat-num" id="cnt-fail">0</div><div class="stat-label">FAILED</div></div>
    <div class="stat"><div class="stat-num" id="cnt-total">0</div><div class="stat-label">TOTAL</div></div>
  </div>

  <div id="log"></div>

  <div id="done-section" style="display:none;margin-top:16px;">
    <button class="btn btn-outline" onclick="downloadReport()">📄 Report Download</button>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────
let sb, workerUrl, adminSecret, ghBase;
let report = [];
let stats  = { done: 0, skip: 0, fail: 0, total: 0 };

// ── Log helper ───────────────────────────────────────────────────────
function log(msg, type = 'info') {
  const el  = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'log-' + type;
  div.textContent = msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function updateStats() {
  document.getElementById('cnt-done').textContent  = stats.done;
  document.getElementById('cnt-skip').textContent  = stats.skip;
  document.getElementById('cnt-fail').textContent  = stats.fail;
  document.getElementById('cnt-total').textContent = stats.total;
}

function setProgress(current, total, label) {
  const pct = total ? Math.round((current / total) * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-pct').textContent  = pct + '%';
  document.getElementById('progress-label').textContent = label || 'Processing...';
}

// ── Main migration ────────────────────────────────────────────────────
async function startMigration() {
  const sbUrl   = document.getElementById('cfg-sb-url').value.trim();
  const sbKey   = document.getElementById('cfg-sb-key').value.trim();
  workerUrl     = document.getElementById('cfg-worker').value.trim().replace(/\/$/, '');
  adminSecret   = document.getElementById('cfg-secret').value.trim();
  ghBase        = document.getElementById('cfg-gh-base').value.trim().replace(/\/$/, '') + '/';

  if (!workerUrl || !adminSecret) {
    alert('Worker URL ane Admin Secret required chhe!');
    return;
  }

  // Init Supabase
  const { createClient } = window.supabase;
  sb = createClient(sbUrl, sbKey);

  document.getElementById('config-section').style.display  = 'none';
  document.getElementById('progress-section').style.display = 'block';

  log('Migration શરૂ...', 'head');
  log('Worker: ' + workerUrl, 'info');
  log('GitHub Base: ' + ghBase, 'info');
  log('─'.repeat(50), 'info');

  // 1. Fetch all products
  log('📦 Products fetch karta chhe...', 'info');
  const { data: products, error } = await sb
    .from('products')
    .select('id, name, image_url, video_url');

  if (error) {
    log('❌ Products fetch failed: ' + error.message, 'err');
    return;
  }

  // Collect all URLs to migrate: {productId, field, url}
  const tasks = [];
  for (const p of products) {
    if (p.image_url && isSupabaseUrl(p.image_url)) {
      tasks.push({ id: p.id, name: p.name, field: 'image_url', url: p.image_url });
    }
    if (p.video_url && isSupabaseUrl(p.video_url)) {
      tasks.push({ id: p.id, name: p.name, field: 'video_url', url: p.video_url });
    }
  }

  stats.total = tasks.length;
  updateStats();

  if (tasks.length === 0) {
    log('✅ Koi Supabase URLs nathi migrate karva — badha already GitHub par chhe!', 'ok');
    document.getElementById('done-section').style.display = 'block';
    return;
  }

  log(`📋 ${tasks.length} files migrate karva chhe (${products.length} products)`, 'info');
  log('─'.repeat(50), 'info');

  // 2. Process each file
  for (let i = 0; i < tasks.length; i++) {
    const task = tasks[i];
    setProgress(i, tasks.length, `(${i+1}/${tasks.length}) ${task.name}`);

    const result = await migrateOne(task, i);
    report.push(result);

    // Small delay to avoid rate limiting GitHub API
    await sleep(300);
  }

  setProgress(tasks.length, tasks.length, 'Complete!');
  log('─'.repeat(50), 'info');
  log(`✅ Migration complete! Migrated: ${stats.done} | Skipped: ${stats.skip} | Failed: ${stats.fail}`, 'ok');

  if (stats.fail > 0) {
    log('⚠️ Failed files report download karo ane manually check karo.', 'err');
  }

  document.getElementById('done-section').style.display = 'block';
  updateStats();
}

// ── Migrate one file ──────────────────────────────────────────────────
async function migrateOne(task, idx) {
  const { id, name, field, url } = task;
  const result = { id, name, field, originalUrl: url, newUrl: null, status: 'pending' };

  try {
    // Build filename from original Supabase URL
    const urlPath  = new URL(url).pathname;
    const origName = urlPath.split('/').pop();
    const folder   = field === 'image_url' ? 'images' : 'videos';
    const filename = folder + '/' + origName;

    // Worker ne sourceUrl aapiye — Worker download + GitHub upload banne karse
    // Browser thi direct Supabase fetch CORS block kare, Worker karse to ok!
    const uploadResp = await fetch(workerUrl + '/migrate-media', {
      method: 'POST',
      headers: {
        'Content-Type':   'application/json',
        'X-Admin-Secret': adminSecret
      },
      body: JSON.stringify({ sourceUrl: url, filename })
    });

    const uploadResult = await uploadResp.json().catch(() => ({}));

    if (!uploadResp.ok) {
      throw new Error('Worker upload failed: ' + (uploadResult.error || uploadResp.status));
    }

    const newUrl = uploadResult.url;

    // Already exists on GitHub — DB update still karo
    if (uploadResult.skipped) {
      const { error: dbErr } = await sb
        .from('products')
        .update({ [field]: newUrl })
        .eq('id', id);
      if (dbErr) throw new Error('DB update failed: ' + dbErr.message);
      result.newUrl = newUrl;
      result.status = 'skip';
      stats.skip++;
      log(`↷ [${id}] ${name} — ${field} already exists, URL updated`, 'skip');
      updateStats();
      return result;
    }

    // Step 3: Update Supabase DB
    const { error: dbErr } = await sb
      .from('products')
      .update({ [field]: newUrl })
      .eq('id', id);

    if (dbErr) {
      throw new Error('DB update failed: ' + dbErr.message);
    }

    result.newUrl  = newUrl;
    result.status  = 'ok';
    stats.done++;
    log(`✓ [${id}] ${name} — ${field} migrated`, 'ok');

  } catch (err) {
    result.status = 'error';
    result.error  = err.message;
    stats.fail++;
    log(`✗ [${id}] ${name} — ${field}: ${err.message}`, 'err');
  }

  updateStats();
  return result;
}

// ── Helpers ───────────────────────────────────────────────────────────
function isSupabaseUrl(url) {
  return url && url.includes('supabase.co');
}

function guessType(url) {
  const ext = url.split('.').pop().toLowerCase().split('?')[0];
  const map = {
    jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png',
    webp: 'image/webp', gif: 'image/gif',
    mp4: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm'
  };
  return map[ext] || 'application/octet-stream';
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload  = () => res(reader.result.split(',')[1]);
    reader.onerror = () => rej(new Error('Blob read failed'));
    reader.readAsDataURL(blob);
  });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function downloadReport() {
  const lines = ['ID,Name,Field,Status,Original URL,New URL,Error'];
  for (const r of report) {
    lines.push([
      r.id, `"${r.name}"`, r.field, r.status,
      r.originalUrl, r.newUrl || '', r.error || ''
    ].join(','));
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'eliitoze-migration-report.csv';
  a.click();
}
</script>
</body>
</html>
