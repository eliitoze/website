<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — ELIITOZE JEWELZ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">ELIITOZE <span>JEWELZ</span></a>
  <nav class="header-nav">
    <a href="index.html">← Shop</a>
    <a href="cart.html" class="cart-btn">
      🛒 Cart
      <span class="cart-count" style="display:none">0</span>
    </a>
  </nav>
</header>

<div class="page-title">Your Cart</div>
<div class="page-subtitle" id="cart-subtitle">Loading...</div>

<div class="cart-layout" id="cart-layout">
  <!-- filled by JS -->
</div>

<footer>
  © 2025 <a href="#">Eliitoze Jewelz</a> · Rajkot, Gujarat
</footer>

<script src="supabase.js"></script>
<script src="script.js"></script>
<script>
const FREE_SHIPPING_MIN = 2000;

function render() {
  const cart = getCart();
  const layout = document.getElementById('cart-layout');
  const subtitle = document.getElementById('cart-subtitle');

  if (cart.length === 0) {
    subtitle.textContent = '0 items';
    layout.innerHTML = `
      <div class="cart-empty">
        <div class="icon">🛒</div>
        <p>Your cart is empty</p>
        <a href="index.html" class="btn-shop">Browse Collection</a>
      </div>`;
    return;
  }

  const totalItems = cart.reduce((s, i) => s + i.qty, 0);
  subtitle.textContent = totalItems + ' item' + (totalItems !== 1 ? 's' : '');

  const total = cartTotal();
  const shippingFree = total >= FREE_SHIPPING_MIN;
  const remaining = FREE_SHIPPING_MIN - total;
  const shippingMsg = shippingFree
    ? `<div class="shipping-msg shipping-free">🎉 You've unlocked Free Shipping!</div>`
    : `<div class="shipping-msg">Add ${formatPrice(remaining)} more for <strong>Free Shipping</strong></div>`;

  const itemsHtml = cart.map(item => `
    <div class="cart-item" data-id="${item.id}">
      <img class="cart-item-img" src="${item.image_url || 'https://via.placeholder.com/80x80/1a1a1a/888'}" alt="${item.name}" />
      <div>
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">${formatPrice(item.display_price)}</div>
      </div>
      <div class="cart-item-right">
        <div class="qty-control">
          <button class="qty-btn" data-action="dec" data-id="${item.id}">−</button>
          <div class="qty-num">${item.qty}</div>
          <button class="qty-btn" data-action="inc" data-id="${item.id}">+</button>
        </div>
        <div class="item-total">${formatPrice(item.display_price * item.qty)}</div>
        <button class="remove-btn" data-id="${item.id}">Remove</button>
      </div>
    </div>`).join('');

  layout.innerHTML = `
    <div class="cart-items">${itemsHtml}</div>
    <div class="cart-summary">
      <div class="summary-title">Order Summary</div>
      <div class="summary-row">
        <span>Subtotal (${totalItems} items)</span>
        <span class="val">${formatPrice(total)}</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span class="val">${shippingFree ? 'FREE 🎉' : 'Calculated at checkout'}</span>
      </div>
      ${shippingMsg}
      <div class="summary-row total">
        <span>Total</span>
        <span class="val">${formatPrice(total)}</span>
      </div>
      <button class="btn-whatsapp" id="wa-btn">
        <span>📲</span> Order on WhatsApp
      </button>
      <a href="index.html" class="btn-continue">Continue Shopping</a>
    </div>`;

  // Qty buttons
  layout.querySelectorAll('.qty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = +btn.dataset.id;
      const c = getCart();
      const i = c.findIndex(x => x.id === id);
      if (i === -1) return;
      if (btn.dataset.action === 'inc') { c[i].qty += 1; }
      else {
        c[i].qty -= 1;
        if (c[i].qty <= 0) c.splice(i, 1);
      }
      saveCart(c);
      render();
    });
  });

  // Remove
  layout.querySelectorAll('.remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = +btn.dataset.id;
      const c = getCart().filter(x => x.id !== id);
      saveCart(c);
      render();
    });
  });

  // WhatsApp — improved message format
  document.getElementById('wa-btn').addEventListener('click', () => {
    const baseUrl = 'https://eliitoze.github.io/website/';
    const cartItems = getCart();
    const grandTotal = cartTotal();
    const totalQty = cartItems.reduce((s, i) => s + i.qty, 0);
    const freeShip = grandTotal >= FREE_SHIPPING_MIN;

    // Build item lines
    const itemLines = cartItems.map((item, idx) => {
      const lineTotal = item.display_price * item.qty;
      return `${idx + 1}. *${item.name}*\n` +
             `   Qty: ${item.qty} × ${formatPrice(item.display_price)} = ${formatPrice(lineTotal)}\n` +
             `   🔗 ${baseUrl}?product=${item.id}`;
    }).join('\n\n');

    const sep = '─────────────────';
    const msg =
`🛍️ *Eliitoze Jewelz — Order Request*

${sep}
${itemLines}
${sep}

📦 *Total Items:* ${totalQty}
💰 *Subtotal:* ${formatPrice(grandTotal)}
🚚 *Shipping:* ${freeShip ? 'FREE 🎉' : 'Will confirm'}
━━━━━━━━━━━━━━━━━
💎 *Grand Total: ${formatPrice(grandTotal)}*

Please confirm my order. Thank you! 🙏`;

    window.open(`https://wa.me/${window.WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  });
}

render();
</script>
</body>
</html>
